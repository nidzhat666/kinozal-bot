[project]
name = "kinozal-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofile>=3.9.0",
    "aiogram>=3.22.0",
    "aioqbt>=1.0.0",
    "beautifulsoup4>=4.14.2",
    "bleach>=6.3.0",
    "structlog>=24.1.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.10",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.1",
    "pyupgrade>=3.21.0",
    "redis>=7.0.1",
    "sulguk>=0.11.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes — unused imports, undefined names, etc.
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort — import sorting
    "UP",     # pyupgrade — modern Python syntax
    "B",      # flake8-bugbear — common pitfalls
    "SIM",    # flake8-simplify — simplifiable code
    "RUF",    # Ruff-specific rules
    "N",      # pep8-naming
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie — misc lints
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking — move imports to TYPE_CHECKING
    "TID",    # flake8-tidy-imports
    "ICN",    # flake8-import-conventions
]
ignore = [
    "E501",   # line length — handled by formatter
    "RET504", # unnecessary assignment before return
    "SIM108", # ternary instead of if-else — can hurt readability
    "RUF001", # ambiguous unicode — false positives on Cyrillic text
]

[tool.ruff.lint.per-file-ignores]
"src/bot/main.py" = ["E402"]  # imports after setup_logging() is intentional

[tool.ruff.lint.isort]
known-first-party = [
    "bot",
    "handlers",
    "models",
    "services",
    "torrents",
    "utilities",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
