services:
  cache:
    image: redis:latest
    restart: always
    command: redis-server --save 20 1 --loglevel warning

  bot:
    depends_on:
      - cache
    image: nidzhat/kinozal_bot:latest
    restart: always
    env_file: .env
    ports:
      - "64873:8000"
    stdin_open: true # docker run -i

volumes:
  cache:
    driver: local
